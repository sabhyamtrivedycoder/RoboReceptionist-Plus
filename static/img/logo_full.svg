<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 100" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="fullBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141416" />
      <stop offset="100%" stop-color="#050507" />
    </linearGradient>

    <linearGradient id="fullBladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <radialGradient id="fullSensorGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="45%" stop-color="#0284c7" stop-opacity="0.8" />
      <stop offset="80%" stop-color="#0369a1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="fullPlusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
  </defs>

  <!-- Left Icon Mark (x: 10, y: 10, size: 80x80) -->
  <g transform="translate(10, 10)">
    <rect x="1" y="1" width="78" height="78" rx="20" fill="url(#fullBgGrad)" stroke="#334155" stroke-width="1.2" />
    
    <!-- Optical Reticle -->
    <circle cx="40" cy="40" r="28" stroke="#334155" stroke-width="0.8" stroke-dasharray="2 4" fill="none" opacity="0.6" />
    
    <!-- Cross Blades -->
    <path d="M35 15 C35 13 45 13 45 15 L44 28 C42 29 38 29 36 28 Z" fill="url(#fullBladeGrad)" />
    <path d="M35 65 C35 67 45 67 45 65 L44 52 C42 51 38 51 36 52 Z" fill="url(#fullBladeGrad)" />
    <path d="M15 35 C13 35 13 45 15 45 L28 44 C29 42 29 38 28 36 Z" fill="url(#fullBladeGrad)" />
    <path d="M65 35 C67 35 67 45 65 45 L52 44 C51 42 51 38 52 36 Z" fill="url(#fullBladeGrad)" />
    
    <!-- Center Optical Aperture -->
    <circle cx="40" cy="40" r="9.5" fill="#0f172a" stroke="#e2e8f0" stroke-width="1.5" />
    <circle cx="40" cy="40" r="5" fill="url(#fullSensorGlow)" />
    <circle cx="40" cy="40" r="2" fill="#ffffff" />
    
    <!-- Plus Accent -->
    <g transform="translate(58, 10)">
      <circle cx="6" cy="6" r="6" fill="#0284c7" fill-opacity="0.25" stroke="url(#fullPlusGrad)" stroke-width="0.9" />
      <line x1="6" y1="3" x2="6" y2="9" stroke="#38bdf8" stroke-width="1.2" stroke-linecap="round" />
      <line x1="3" y1="6" x2="9" y2="6" stroke="#38bdf8" stroke-width="1.2" stroke-linecap="round" />
    </g>
  </g>

  <!-- Typography Right Side -->
  <text x="110" y="47" font-family="'Fraunces', Georgia, serif" font-weight="400" font-size="28" fill="#0a0a0a" letter-spacing="-0.02em">
    Robo Receptionist <tspan fill="#0284c7" font-weight="600">+</tspan>
  </text>
  <text x="111" y="69" font-family="'IBM Plex Mono', ui-monospace, monospace" font-weight="500" font-size="10.5" fill="#64748b" letter-spacing="0.24em">
    AUTONOMOUS CLINICAL TRIAGE
  </text>
</svg>
